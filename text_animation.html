<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text-container{
            display: flex;
            justify-content: center;
            font-family: monospace;
            font-size: 80px;
            font-weight: 800px;
            letter-spacing: 5px;
            perspective: 100px;
        }
        .text-container > b{
            height: 80px;
            box-shadow: 0px 20px 10px gray;
            background-color: brown;
            background-clip: text;
            color: transparent;
            transform-origin: bottom;
            animation: getUpDown 20s infinite;
        }
        .text-container >b:nth-child(1){animation-delay: 0s;}
        .text-container >b:nth-child(2){animation-delay: 0.25s;}
        .text-container >b:nth-child(3){animation-delay: 0.50s;}
        .text-container >b:nth-child(4){animation-delay: 0.75s;}
        .text-container >b:nth-child(5){animation-delay: 1s;}
        
        @keyframes getUpDown{
            from{transform: rotateX(-85deg);}
            10%,50%{transform: rotateX(0);}
            60%,to{transform: rotateX(-85deg);}

        }
    </style>
</head>
<body>
    <div class="text-container">
        <b>A</b><b>S</b><b>H</b><b>U</b>

    </div>
</body>
</html>
