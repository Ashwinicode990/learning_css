<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container1{
            position:relative
        }
        div{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
        }
        .blue{
            background-color: blue;
            left:40px;
            z-index: 10;
        }
        .red{
            background-color: red;
            left:80px;
            z-index: 11;
        }
        .green{
            background-color: green;
            left: 120px;
            z-index: 12;
        }
    </style>
</head>
<body>
    <div class="container1">
        <div class="blue"></div>
        <div class="red"></div>
        <div class="green"></div>
    

    </div>
</body>
</html>
