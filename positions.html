<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 150px;
            border: 2px solid palevioletred;
            background-color: antiquewhite;
            margin-bottom: 20px;
        }
        .box_static{
            position: static;
            /* left: 200px; */
        }
        .box_relative{
            position: relative;
            left: 250px;
            top: 40px;
        }
        .box_abs{
            position: absolute;
            left: 400px;
            top: 40px; 
        }
        .box_sticky{
            position: sticky;
            top: 10px;
        }
        .box_fixed{
            position: fixed;
        } 

    </style>
</head>
<body>
    <div class="box box_static">Static</div>
    <div class="box box_relative">Relative</div>
    <div class="box box_abs">Absolute</div>
    <div class="box box_sticky">Sticky</div>
    <div class="box box_fixed">Fixed</div>
   
</body>
</html>
