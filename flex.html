<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-items{
            background-color: blueviolet;
            width: 200px;
            height: 180px;
            font-size: 30px;
            margin: 10px;
            color: honeydew;
            border: 2px solid pink;
            padding: 10px;
            display: flex;
            justify-content: center;
            /* horizontal center */
            align-items: center;
            /* vertical center */
        }
        .flex-container{
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            justify-content: center;
            list-style: none;
        }
    </style>
</head>
<body>

    <!-- ul.flex-container>li.flex-items*10 -->
    <ul class="flex-container">
        <li class="flex-items">1</li>
        <li class="flex-items">2</li>
        <li class="flex-items">3</li>
        <li class="flex-items">4</li>
        <li class="flex-items">5</li>
        <li class="flex-items">6</li>
        <li class="flex-items">7</li>
        <li class="flex-items">8</li>
        <li class="flex-items">9</li>
        <li class="flex-items">10</li>
    </ul>
</body>
</html>
