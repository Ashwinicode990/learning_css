<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            height: 400px;
            background: linear-gradient(pink,rgb(220, 97, 179),rgb(211, 55, 151));
            display: flex; 
            justify-content: center;
            align-items: center;
        }
        .radial{
            height: 800px;
            background: radial-gradient(pink,brown,purple);
        }
        .conic{
            height: 500px;
            background: conic-gradient(pink,brown,purple);
        }

    </style>
</head>
<body>
    <div class="linear"><h1>Welcome</h1></div>
    <div class="radial"></div>
    <div class="conic"></div>
    
</body>
</html>
