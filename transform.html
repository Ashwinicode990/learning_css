<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .s_box{
            background-color: bisque;
            border-radius: 10px;
            height: 200ps;
            width: 200px;
            color: chocolate;
            font-size: 30px;
            padding: 10px;
            margin: 10px;
            border: 2px solid white;
            transition: transform 5s ease-in;
        }
        body{
            background-color: black;
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .s_box1:hover{
            transform: translate(125px,125px);
        }
        .s_box2:hover{
            transform: translatex(120px);
            background-color: blueviolet;
        }
        .s_box3:hover{
            transform: translatey(150px);
        }
        .s_box4:hover{
            transform: rotate(360deg);
        }
        .s_box5:hover{
            transform: skewY(50deg);
        }
        .s_box6:hover{
            transform: scale(1.5);
        }
        .s_box7:hover{
            transform: rotate(90deg) scale(1.2) translatey(50px);
        }

    </style>
</head>
<body>
    <div class="container">
    <div class="s_box s_box1">Translate</div>
    <div class="s_box s_box2">Translate x</div>
    <div class="s_box s_box3">Translate y</div>
    <div class="s_box s_box4">Rotate</div>
    <div class="s_box s_box5">Skew</div>
    <div class="s_box s_box6">Scale</div>
    <div class="s_box s_box7">Multi</div>
    </div>
</body>
</html>
