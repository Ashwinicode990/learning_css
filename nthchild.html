<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            width: 200px;
            padding: 10px;
            list-style-type: none;
            font-weight: 900;
        }
        li{
            padding: 10px;
            border: 2px solid red;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        li:nth-child(odd){
            background-color: beige;
        }
        li:nth-child(even){
            background-color: rgb(226, 125, 125);
        }
        li:first-child{
            background-color: blueviolet;
        }
        li:last-child{
            background-color: #bd6e01;
        }
        li:nth-child(5){
            background-color: azure;
        }


    </style>
</head>
<body>
    <img src="image/sunset.jpeg"/>
    <!-- ul>li*8{Item $} -->
     <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
        <li>Item 7</li>
        <li>Item 8</li>
     </ul>

    </body>
</html>
